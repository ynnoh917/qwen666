name: Finetune Uncensored Qwen

on:
  workflow_dispatch:

env:
  HF_REPO: ${{ vars.HF_REPO }}
  BASE_MODEL_ID: ${{ vars.BASE_MODEL_ID }}

jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 缓存依赖，加速下次运行
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-python-${{ hashFiles('requirements.txt') }}
          
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          
      - name: Prepare data
        run: python make_data.py
        
      - name: LoRA Finetune
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python train.py
        
      - name: Merge and Export GGUF (Fast)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python merge_and_export.py

      # 🔥 核心新增：将生成的所有 .gguf 文件上传到 GitHub Actions 的 Artifacts
      - name: Upload GGUF to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Qwen-HaHaHa-Quantized-Models
          path: "*.gguf"
          retention-days: 7 # 保留7天